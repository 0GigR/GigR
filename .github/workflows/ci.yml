name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    services:
      # Fresh PostGIS database — matches the suite's assumption that it can
      # init_db() an empty database (see tests/conftest.py db_ready fixture).
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The PayPal rail needs no Solana settings. External services are stubbed
      # by the suite; PayPal is replaced by an in-memory fake (tests/test_paypal_flow.py).
      PAYMENT_RAIL: paypal
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
      ADMIN_SECRET: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest smoke suite
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend build + bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests (WebMCP tools, currency, PayPal agent flow)
        working-directory: frontend
        run: npm test

      - name: Build (tsc + vite + bundle-size check)
        working-directory: frontend
        run: npm run build
