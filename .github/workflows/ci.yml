name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    services:
      # Fresh PostGIS database — matches the suite's assumption that it can
      # init_db() an empty database (see tests/conftest.py db_ready fixture).
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Dummy values — the smoke suite stubs external services, but app.main
      # parses some of these at import time, so they must be syntactically valid.
      GIGR_PROGRAM_ID: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      SOLANA_RPC_URL: https://api.devnet.solana.com
      PLATFORM_KEYPAIR: "[]"
      WALLET_ENCRYPTION_KEY: 9XBJjT14wT4aCBOx5zpHF_dmO3Lwryct6eKbV1QqSfM=
      USDC_MINT_DEVNET: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      BREVO_API_KEY: dummy
      BREVO_SENDER_EMAIL: dummy@example.com
      STADIA_MAPS_API_KEY: dummy
      UNDERDOG_API_KEY: dummy
      UNDERDOG_API_URL: https://devnet.underdogprotocol.com
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
      ADMIN_SECRET: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest smoke suite
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend build + bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc + vite + bundle-size check)
        working-directory: frontend
        run: npm run build
