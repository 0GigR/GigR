[pytest]
# anchorpy registers a pytest plugin that requires the optional `xprocess`
# package (used for running a local solana test validator). We don't need it,
# so disable it to keep the smoke suite dependency-light.
addopts = -p no:pytest_anchorpy
testpaths = tests
asyncio_mode = auto
# Single loop for the whole session: the API fires background asyncio tasks
# (web push, provider matching, emails) during requests, and those must be
# allowed to complete instead of crashing when a per-test loop closes.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
