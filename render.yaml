# Render Blueprint — deploys Gigr (FastAPI + PostGIS + React PWA) in one click.
#   Render dashboard → New → Blueprint → pick this repo.
#
# After the first deploy, fill in the `sync: false` secrets in the dashboard
# (PayPal sandbox credentials first — see docs/PAYPAL_SETUP.md).

databases:
  - name: gigr-db
    databaseName: gigr
    user: gigr
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: gigr-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gigr-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false          # create the webhook after the first deploy (docs/PAYPAL_SETUP.md)
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: FRONTEND_URL
        sync: false          # e.g. https://gigr-web.onrender.com
      - key: GROQ_API_KEYS
        sync: false          # free key from console.groq.com — powers the agent + AI arbiter
      - key: AUTO_RELEASE_SECONDS
        value: "3600"
      # Optional integrations (the app runs without them; the feature just degrades)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Web app (static PWA) ───────────────────────────────────────────────────
  - type: web
    name: gigr-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_PAYMENT_RAIL
        value: paypal        # 'solana' for the original app
      - key: VITE_API_URL
        sync: false          # e.g. https://gigr-api.onrender.com/api/v1
      - key: VITE_WS_URL
        sync: false          # e.g. wss://gigr-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
    routes:
      # SPA fallback so deep links like /dashboard/paypal/return work on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
